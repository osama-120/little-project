<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffe3ef">
<title>هدية صغيرة لياسمين 🎀</title>
<style>
:root{--pink:#ff6fae;--deep:#b73578;--light:#fff4f8;--lav:#f2e8ff;--ink:#66344f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at top,#fffafd,#ffe3ef 60%,#f8d9f1);overflow-x:hidden}
button{font:inherit;cursor:pointer}
.wrap{width:min(100% - 24px,520px);margin:0 auto;padding:24px 0 42px}
.card{position:relative;background:rgba(255,255,255,.88);border:2px solid #ffc2dc;border-radius:28px;padding:28px 22px;box-shadow:0 14px 40px #c75a8b22;text-align:center;overflow:hidden;min-height:450px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.card:before{content:"♡  ✧  ♡  ✿  ♡";position:absolute;top:12px;left:10px;color:#f28dbb;letter-spacing:7px;font-size:15px;opacity:.8}
.card:after{content:"✧  ♡  🎀  ♡  ✧";position:absolute;bottom:12px;right:10px;color:#f28dbb;letter-spacing:4px;font-size:14px;opacity:.8}
.kicker{font-size:.9rem;color:#bb5c8b;margin-bottom:8px}
h1{font-size:clamp(1.7rem,7vw,2.35rem);color:var(--deep);margin:8px 0 14px;line-height:1.5}
h2{font-size:1.5rem;color:var(--deep);margin:8px 0 14px}
p{font-size:1.06rem;line-height:2;margin:8px 0 16px}
.big{font-size:3.8rem;margin:4px 0}
.btn{border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(135deg,#ff8abd,#e85298);color:white;box-shadow:0 7px 16px #e8529840;margin:7px 4px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.secondary{background:#fff;color:var(--deep);border:1.5px solid #f29bc3;box-shadow:none}
.choices{display:grid;gap:10px;width:100%;margin:12px 0}
.choice{border:1.5px solid #f3a5c8;border-radius:16px;background:#fff8fb;padding:13px;color:#743b5a;text-align:right}
.choice:hover,.choice:focus{background:#ffe5f0}
.note{background:#fff5f9;border:1px dashed #ed91ba;border-radius:18px;padding:15px;line-height:2;text-align:center}
.hidden{display:none!important}
.progress{height:5px;background:#f9c5dd;border-radius:99px;overflow:hidden;margin:0 0 12px}
#bar{height:100%;width:10%;background:#e85298;transition:width .3s}
footer{font-size:.8rem;text-align:center;color:#a65b82;margin-top:14px}
.burst{position:fixed;pointer-events:none;animation:float 2.8s ease-out forwards;z-index:5}
@keyframes float{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-100vh) rotate(240deg);opacity:0}}
input{font:inherit;border:1px solid #f0a0c4;border-radius:12px;padding:12px;width:100%;text-align:center;margin:8px 0;background:#fffafd;color:var(--ink)}
.small{font-size:.88rem;color:#9b5a7b}
</style>
</head>
<body>
<main class="wrap">
  <div class="progress"><div id="bar"></div></div>
  <section class="card" id="screen">
    <div class="kicker">🎀 هدية صغيرة، معمولة بمحبة 🎀</div>
    <div class="big">💌</div>
    <h1>مفاجأة لياسمين!</h1>
    <p>يا ياسمين، عندي ليكِ حاجة صغيرة…<br>ولكن ممنوع تشوفي النهاية قبل ما تكمّلي الرحلة 😉💗</p>
    <button class="btn" onclick="go(1)">أنا مستعدة، افتحيها ✨</button>
    <div class="small">حضّري ابتسامتك فقط 🌷</div>
  </section>
  <footer>صُنعت خصيصًا لياسمين بكل محبة ♡</footer>
</main>
<script>
const screens = [
{html:`<div class="kicker">الرسالة الأولى</div><div class="big">🌸</div><h2>إلى ياسمين الجميلة</h2><p>يمكن تعارفنا كان عبر الإنترنت، وما جمعناش مكان واحد… لكن هذا ما كيمنعش أن بعض الناس كيخلّيو أثرًا جميلًا فحياتنا، حتى من وراء الشاشة. 💗</p><button class="btn" onclick="go(2)">كمّلي، مازال كاين ✨</button>`},
{html:`<div class="kicker">اختبار صغير جدًا</div><div class="big">🎀</div><h2>شنو أكثر حاجة كتستاهلها ياسمين؟</h2><div class="choices"><button class="choice" onclick="answer(this)">أ) نهار مليان ضحك 😂</button><button class="choice" onclick="answer(this)">ب) محبة وناس صادقين 💗</button><button class="choice" onclick="answer(this)">ج) تتحقق ليها أمنية عزيزة ✨</button><button class="choice" onclick="answer(this)">د) كلشي اللي فوق! 🌷</button></div><p id="quizMsg" class="small"></p><button id="quizNext" class="btn hidden" onclick="go(3)">عرفتِ الجواب؟ كمّلي 💌</button>`},
{html:`<div class="kicker">هدية صغيرة رقم 1</div><div class="big">🎁</div><h2>افتحي الهدية</h2><p>اضغطي على الصندوق، راه مخبّي ليك رسالة صغيرة.</p><button class="btn" onclick="revealGift(this)">🎀 افتحي الصندوق 🎀</button><div id="giftMsg" class="note hidden">أمنية من قلبي: يجيك عام جديد مليان لحظات زوينة، وناس يقدّرو قلبك، وفرص تفرّحك أكثر مما كنتِ كتتوقعي. 💗</div><button class="btn secondary" onclick="go(4)">التالي 🌸</button>`},
{html:`<div class="kicker">رسالة من القلب</div><div class="big">💗</div><h2>بغيت نقول ليك حاجة</h2><p>شكرًا لأنك جزء من أيامي، على الضحكات والمحادثات واللحظات الصغيرة اللي يمكن تبان عادية، ولكن كتخلّي الذكريات مميزة. وجودك يستاهل الاحتفال، واليوم فرصتي باش نقول ليك هذا الشي. 🌷</p><button class="btn" onclick="go(5)">باقي رسالة أخيرة… 💌</button>`},
{html:`<div class="kicker">المفاجأة الأخيرة</div><div class="big">🎂</div><h1>عيد ميلاد سعيد يا ياسمين!</h1><p>أتمنى لكِ عامًا جديدًا مليئًا بالفرح والنجاح والراحة والأمنيات اللي كتولي حقيقة. خلي ضحكتك حاضرة، وكوني لطيفة مع نفسك، وتذكّري أنك تستحقين كل خير. 💕</p><div class="note">حتى لو كانت صداقتنا عبر الإنترنت، فالاهتمام الصادق يقدر يوصل من أي مسافة. شكرًا لأنك أنتِ. 🌙💗</div><button class="btn" onclick="celebrate()">اضغطي للاحتفال 🎉</button><button class="btn secondary" onclick="restart()">عاودي الرحلة من الأول ↺</button>`}
];
let current=0;
function go(n){current=n;const el=document.getElementById('screen');el.innerHTML=screens[n-1].html;document.getElementById('bar').style.width=((n+1)/(screens.length+1)*100)+'%';window.scrollTo({top:0,behavior:'smooth'});}
function answer(btn){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('quizMsg').textContent='الجواب الصحيح؟ كلشي اللي فوق طبعًا! تستاهلي الفرح كامل يا ياسمين 💗';document.getElementById('quizNext').classList.remove('hidden');btn.style.background='#ffe0ed';}
function revealGift(btn){document.getElementById('giftMsg').classList.remove('hidden');btn.textContent='انفتحت الهدية! 💖';btn.disabled=true;hearts(10);}
function hearts(count){const icons=['💗','💕','🌸','✨','🎀','💖'];for(let i=0;i<count;i++){const s=document.createElement('span');s.className='burst';s.textContent=icons[Math.floor(Math.random()*icons.length)];s.style.left=Math.random()*95+'vw';s.style.bottom='-20px';s.style.fontSize=(18+Math.random()*18)+'px';s.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4200);}}
function celebrate(){hearts(35);document.querySelector('#screen h1').textContent='كل عام وأنتِ بخير يا ياسمين! 💗';}
function restart(){current=0;document.getElementById('screen').innerHTML=`<div class="kicker">🎀 هدية صغيرة، معمولة بمحبة 🎀</div><div class="big">💌</div><h1>مفاجأة لياسمين!</h1><p>يا ياسمين، عندي ليكِ حاجة صغيرة…<br>ولكن ممنوع تشوفي النهاية قبل ما تكمّلي الرحلة 😉💗</p><button class="btn" onclick="go(1)">أنا مستعدة، افتحيها ✨</button><div class="small">حضّري ابتسامتك فقط 🌷</div>`;document.getElementById('bar').style.width='10%';}
</script>
</body>
</html>
